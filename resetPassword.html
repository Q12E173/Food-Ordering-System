<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Food Ordering System</title>
    <link rel="icon" href="images/logo.png" type="image/ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link rel="stylesheet" href="css/adminhome.css">
    <link rel="stylesheet" href="css/resetPassword.css">
</head>
<body>
    <section id="menu">
        <div class="logo">
            <img src="images/cashier.png" alt="food ordering system"> 
            <h2>Hello, Admin!</h2>
        </div>
        <div class="items">
            <li><a href="adminhome.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="orders.html"><i class="fas fa-list"></i> View Orders</a></li>
            <li><a href="receipt.html"><i class="fas fa-receipt"></i> Print Receipt</a></li>
            <li><a href="addDish.html" ><i class="fas fa-plus-circle"></i> Add New Dish</a></li>
            <li><a href="showMenu.html"><i class="fas fa-utensils"></i> Show Menu</a></li>
            <li><a href="earning.html"><i class="fas fa-chart-line"></i> View Earning</a></li>
            <li><a href="resetPassword.html" class="active" id="editPassword"><i class="fas fa-key"></i> Reset Password</a></li>
        </div>
    </section>

    <section id="interface">
        <div class="navigation">
            <div class="title">
                <h3>QikiQ Sushi</h3>
            </div>
            <div class="logout">
                <a href="logout.php" class="fas fa-sign-out-alt" style="font-size: 30px; color: red; text-decoration: none;"></a>
            </div>
        </div>

        <h3 class="i-name">
            Reset Password
        </h3>

        <div class="container" id="step1">
            <form id="verifyAdminForm" onsubmit="return verifyAdmin()">
                <label for="admin_id">Admin ID:</label>
                <input type="text" id="admin_id" name="admin_id" required><br>
                <label for="admin_password">Current Password:</label>
                <input type="password" id="admin_password" name="admin_password" required><br>
                <div id="errorMessage" style="margin-top: 10px; display: none; color: red;">Invalid Admin ID or Password.</div>
                <button type="submit">Reset Password</button>
            </form>
        </div>
    
        <div class="container" id="step2" style="display: none;">
            <form id="resetPasswordForm" action="resetPassword.php" method="post" onsubmit="return validateNewPassword();">
                <label for="newPassword">Enter new password:</label>
                <input type="password" id="newPassword" name="newPassword" required><br>
                <label for="confirmPassword">Confirm new password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required><br>
                <input type="hidden" id="hiddenAdminId" name="admin_id">
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </section>

    <script src="js/resetPassword.js"></script>
</body>
</html>
