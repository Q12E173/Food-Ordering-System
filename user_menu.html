<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QikiQ Sushi Menu</title>
    <link rel="icon" href="images/logo.png" type="image/ico">
    <link rel="stylesheet" href="css/user_menu.css">
    <link rel="stylesheet" href="css/user_cart.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="QikiQ Sushi" class="logo">
        <h1>QikiQ Sushi</h1>
        <a href="logout.php"><button class="logout">Log Out</button></a>
    </header>
    <div class="sidebar">
        <a href="#sushi"><img src="images/sushi.png" alt="Sushi">Sushi</a>
        <a href="#sashimi"><img src="images/sashimi.png" alt="Sashimi">Sashimi</a>
        <a href="#donburi"><img src="images/donburi.png" alt="Donburi">Donburi</a>
        <a href="#bento"><img src="images/bento.png" alt="Bento">Bento</a>
        <a href="#ramen"><img src="images/ramen.png" alt="Ramen/Udon">Ramen/Udon</a>
        <a href="#tempura"><img src="images/tempura.png" alt="Tempura">Tempura</a>
        <a href="#beverage"><img src="images/beverage.png" alt="Beverage">Beverage</a>
        <a href="#dessert"><img src="images/dessert.png" alt="Dessert">Dessert</a>
    </div>
    <div class="content">
        <section id="sushi">
            <h2>Sushi</h2>
            <div class="item-container" id="sushi-items"></div>
        </section>
        <section id="sashimi">
            <h2>Sashimi</h2>
            <div class="item-container" id="sashimi-items"></div>
        </section>
        <section id="donburi">
            <h2>Donburi</h2>
            <div class="item-container" id="donburi-items"></div>
        </section>
        <section id="bento">
            <h2>Bento</h2>
            <div class="item-container" id="bento-items"></div>
        </section>
        <section id="ramen">
            <h2>Ramen/Udon</h2>
            <div class="item-container" id="ramen-items"></div>
        </section>
        <section id="tempura">
            <h2>Tempura</h2>
            <div class="item-container" id="tempura-items"></div>
        </section>
        <section id="beverage">
            <h2>Beverage</h2>
            <div class="item-container" id="beverage-items"></div>
        </section>
        <section id="dessert">
            <h2>Dessert</h2>
            <div class="item-container" id="dessert-items"></div>
        </section>
    </div>
    <footer>
        <div class="footer-left">
            <div id="cart-summary">
                0 Item(s)
            </div>
        </div>
        <div class="footer-center">
            <div id="total-price">
                Total Price: RM00.00
            </div>
        </div>
        <div class="footer-right">
            <a href="user_cart.html" class="my-cart">
                <img src="images/cart.png" alt="Cart" class="cart-icon">
                My Cart
            </a>
        </div>
        </footer>
        

   
    <script src="js/user_menu.js"></script>

    <script>
        fetch('user_menu.php')
            .then(response => response.json())
            .then(data => {
                document.getElementById('sushi-items').innerHTML = data.Sushi;
                document.getElementById('sashimi-items').innerHTML = data.Sashimi;
                document.getElementById('donburi-items').innerHTML = data.Donburi;
                document.getElementById('bento-items').innerHTML = data.Bento;
                document.getElementById('ramen-items').innerHTML = data['Ramen/Udon'];
                document.getElementById('tempura-items').innerHTML = data.Tempura;
                document.getElementById('beverage-items').innerHTML = data.Beverage;
                document.getElementById('dessert-items').innerHTML = data.Dessert;
            });
    </script>
</body>
</html>
