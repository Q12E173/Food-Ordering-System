<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Food Ordering System</title>
    <link rel="icon" href="images/logo.png" type="image/ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link rel="stylesheet" href="css/adminhome.css">
    <link rel="stylesheet" href="css/showMenu.css">
    <script src="js/showMenu.js" defer></script> 
</head>
<body>
    <section id="menu">
        <div class="logo">
            <img src="images/cashier.png" alt="food ordering system"> 
            <h2>Hello, Admin!</h2>
        </div>
        <div class="items">
            <li><a href="adminhome.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="orders.html"><i class="fas fa-list"></i> View Orders</a></li>
            <li><a href="receipt.html"><i class="fas fa-receipt"></i> Print Receipt</a></li>
            <li><a href="addDish.html"><i class="fas fa-plus-circle"></i> Add New Dish</a></li>
            <li><a href="showMenu.html" class="active"><i class="fas fa-utensils"></i> Show Menu</a></li>
            <li><a href="earning.html"><i class="fas fa-chart-line"></i> View Earning</a></li>
            <li><a href="resetPassword.html" id="editPassword"><i class="fas fa-key"></i> Reset Password</a></li>
        </div>
    </section>

    <section id="interface">
        <div class="navigation">
            <div class="title">
                <h3>QikiQ Sushi</h3>
            </div>
            <div class="logout">
                <a href="logout.php" class="fas fa-sign-out-alt" style="font-size: 30px; color: red; text-decoration: none;"></a>
            </div>
        </div>

        <h3 class="i-name">
            Menu
        </h3>
    
        
    <div class="menuContainer">
        <div class="filterContainer">
            <label for="dishType">Dishes Type:</label>
            <select id="dishType" name="type" onchange="fetchMenu()">
                <option value="Sushi" selected>Sushi</option>
                <option value="Sashimi">Sashimi</option>
                <option value="Donburi">Donburi</option>
                <option value="Bento">Bento</option>
                <option value="Ramen/Udon">Ramen/Udon</option>
                <option value="Tempura">Tempura</option>
                <option value="Beverage">Beverage</option>
                <option value="Dessert">Dessert</option>
            </select>
        </div>
        <div class="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Dish</th>
                        <th>Price (RM)</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="menuTable">
                </tbody>
            </table>
        </div>
    </div>

    <div id="editDishModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="hideModal()">&times;</span>
            <h2>Edit Dish</h2>
            <form id="editDishForm" action="editDish.php" method="post" enctype="multipart/form-data">
                <input type="hidden" id="dishId" name="item_id">
                <div class="formQuestion">
                    <label for="name">Enter Dish Name<span style="color: red">*</span></label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="formQuestion">
                    <label for="price">Enter Dish Price (RM)<span style="color: red">*</span></label>
                    <input type="number" step="0.01" id="price" name="price" required>
                </div>
                <div class="formQuestion">
                    <label for="image">Upload Image<span style="color: red">*</span></label>
                    <input type="file" id="image" name="image">
                </div>
                <div class="formQuestion">
                    <label for="description">Description<span style="color: red">*</span></label>
                    <textarea id="description" name="description" rows="4" required></textarea>
                </div>
                <div class="formButtons">
                    <button type="submit" class="addBtn">Save Changes</button>
                    <button type="button" class="cancelBtn" onclick="hideModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    </section>
    

</body>
</html>
