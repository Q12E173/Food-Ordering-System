<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="icon" href="images/logo.png" type="image/ico">
    <link rel="stylesheet" href="css/admin_login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="main.html"><img src="images/logo.png" alt="QikiQ Sushi Logo"></a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="main.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="about_us.html"><i class="fas fa-info-circle"></i> About Us</a></li>
                <li><a href="admin_login.html"><i class="fas fa-user-shield"></i> Admin</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-content">
        <div class="login-container animate__animated animate__fadeInUp">
            <h1>Admin Login</h1>
            <p id="error-message" class="error" style="display: none;"></p>
            <form id="admin-login-form" method="POST" action="admin_login.php">
                <div class="form-group">
                    <label for="admin_id"><i class="fas fa-user"></i></label>
                    <input type="text" id="admin_id" name="admin_id" required placeholder="Admin ID">
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i></label>
                    <input type="password" id="password" name="admin_password" required placeholder="Password">
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
        <div class="image-section">
            <img src="images/sushi3.png" alt="Sushi Illustration" class="animate__animated animate__fadeInLeft">
        </div>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-section about">
                <h3>About QikiQ Sushi</h3>
                <p>QikiQ Sushi is dedicated to offering the finest sushi experience, blending traditional techniques with modern twists. 
                    Join us for an unforgettable dining experience.</p>
                <button onclick="window.location.href='about_us.html'">Learn More</button>
            </div>
            <div class="footer-section contact">
                <h3>Contact Us</h3>
                <p><i class="fas fa-phone-alt"></i> +6019-7969659</p>
                <p><i class="fas fa-envelope"></i> qikiqsushi@gmail.com</p>
            </div>
        </div>
    </footer>
</body>
</html>
