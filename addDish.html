<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Dish - Food Ordering System</title>
    <link rel="icon" href="images/logo.png" type="image/ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link rel="stylesheet" href="css/adminhome.css">
    <link rel="stylesheet" href="css/addDish.css">
    <script>
        function validateForm() {
            var type = document.forms["dishForm"]["type"].value;
            var name = document.forms["dishForm"]["name"].value;
            var price = document.forms["dishForm"]["price"].value;
            var image = document.forms["dishForm"]["image"].files[0];
            var description = document.forms["dishForm"]["description"].value;

            if (type == "" || name == "" || price == "" || !image || description == "") {
                alert("All fields must be filled out");
                return false;
            }

            if (price < 1) {
                alert("Price must be greater than 1");
                return false;
            }

            // Check image file type
            var allowedTypes = ["image/jpeg", "image/png", "image/gif"];
            if (!allowedTypes.includes(image.type)) {
                alert("Sorry, only JPG, JPEG, PNG & GIF files are allowed.");
                return false;
            }

            return true;
        }

        function cancelForm() {
            document.forms["dishForm"].reset();
        }
    </script>
</head>
<body>
    <section id="menu">
        <div class="logo">
            <img src="images/cashier.png" alt="food ordering system"> 
            <h2>Hello, Admin!</h2>
        </div>
        <div class="items">
            <li><a href="adminhome.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="orders.html"><i class="fas fa-list"></i> View Orders</a></li>

            <li><a href="showMenu.html"><i class="fas fa-utensils"></i> Show Menu</a></li>
            <li><a href="earning.html"><i class="fas fa-chart-line"></i> View Earning</a></li>
            <li><a href="resetPassword.html" id="editPassword"><i class="fas fa-key"></i> Reset Password </a></li>
        </div>
    </section>

    <section id="interface">
        <div class="navigation">
            <div class="title">
                <h3>QikiQ Sushi</h3>
            </div>
            <div class="logout">
                <a href="logout.php" class="fas fa-sign-out-alt" style="font-size: 30px; color: red; text-decoration: none;"></a>
            </div>
        </div>

        <h3 class="i-name">
            Add New Dish
        </h3>
        <div class="formContainer">
            <form name="dishForm" action="addDish.php" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
                <h1>Form to Add New Dish</h1>
                <div class="formQuestion">
                    <label for="type">Select Dish Type<span style="color: red">*</span></label>
                    <select name="type" id="type" required>
                        <option value="Sushi">Sushi</option>
                        <option value="Sashimi">Sashimi</option>
                        <option value="Donburi">Donburi</option>
                        <option value="Bento">Bento</option>
                        <option value="Ramen/Udon">Ramen/Udon</option>
                        <option value="Tempura">Tempura</option>
                        <option value="Beverage">Beverage</option>
                        <option value="Dessert">Dessert</option>
                    </select>
                </div>
    
                <div class="formQuestion">
                    <label for="name">Enter Dish Name<span style="color: red">*</span></label>
                    <input type="text" id="name" name="name" required>
                </div>
    
                <div class="formQuestion">
                    <label for="price">Enter Dish Price (RM)<span style="color: red">*</span></label>
                    <input type="number" step="0.01" id="price" name="price" min="1.00" required>
                </div>
    
                <div class="formQuestion">
                    <label for="image">Upload Image<span style="color: red">*</span></label>
                    <input type="file" id="image" name="image" required>
                </div>
    
                <div class="formQuestion">
                    <label for="description">Description<span style="color: red">*</span></label>
                    <textarea id="description" name="description" rows="2" required></textarea>
                </div>
    
                <div class="formButtons">
                    <button type="submit" class="addBtn">Add</button>
                    <button type="button" class="cancelBtn" onclick="cancelForm()">Cancel</button>
                </div>
            </form>
        </div>

    </section>
</body>
</html>
